name: release

# Triggered by pushing a version tag such as v1.0.0. Builds the Windows portable
# package on GitHub-hosted runners and attaches it to the Release.
#
# Native POSIX artifacts (Linux, macOS, Android, openEuler) are produced with
# zig cross-compilation on the maintainer machine and uploaded manually; this
# workflow intentionally publishes only what it can build and verify itself.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the package to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  windows-package:
    name: Windows portable package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Build Web UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend and run tests
        shell: msys2 {0}
        run: |
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ci -j 4
          ctest --test-dir build-ci --output-on-failure

      - name: Assemble portable package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart("v") } else { "${{ github.event.inputs.tag }}".TrimStart("v") }
          $stage = "ModelForge-$version-win64"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "build-ci/bin/modelforge.exe" $stage
          Copy-Item "frontend/dist/*" $stage -Recurse
          Copy-Item README.md, README.zh-CN.md, LICENSE, CHANGELOG.md $stage -ErrorAction SilentlyContinue
          Copy-Item docs $stage -Recurse
          Copy-Item scripts/setup-python.ps1 $stage
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          $hash = (Get-FileHash -Algorithm SHA256 "$stage.zip").Hash.ToLowerInvariant()
          "$hash  $stage.zip" | Out-File -Encoding ascii "$stage.zip.sha256"

      - name: Check whether the release already exists
        id: release_check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.ref_name }}" }
          $code = & curl.exe -s -o NUL -w "%{http_code}" -H "Authorization: Bearer $env:GH_TOKEN" `
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag"
          if ($code -eq "200") {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=true"
            Write-Host "Release $tag already exists; skipping asset upload to avoid overwriting published files."
          }
          else {
            Add-Content -Path $env:GITHUB_OUTPUT -Value "exists=false"
          }

      - name: Upload release assets
        if: steps.release_check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ModelForge-*-win64.zip
            ModelForge-*-win64.zip.sha256
          fail_on_unmatched_files: true
