<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080b10" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f7fb" />
    <meta name="description" content="ModelForge — 本地 AI 模型转换与管理平台" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>ModelForge</title>
  </head>
  <body>
    <script>
      // Apply the cached theme before first paint so a light-theme user never sees
      // a dark flash while the app boots.
      (function () {
        try {
          var mode = localStorage.getItem('modelforge.theme') || 'dark'
          var light =
            mode === 'light' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.dataset.theme = light ? 'light' : 'dark'
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
